<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>henwei</title>
<style>
  :root {
    --bg: #0a0b0f;
    --fg: #e8eaed;
    --muted: #8b90a0;
    --line: #1e212b;
    --accent: #7c8cff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    display: grid;
    place-items: center;
    padding: 2rem;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  .orb {
    position: fixed;
    width: 60vmax; height: 60vmax;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(124,140,255,.18) 0%, transparent 62%);
    top: -22vmax; right: -18vmax;
    pointer-events: none;
    animation: float 14s ease-in-out infinite alternate;
  }
  @keyframes float {
    from { transform: translate3d(0,0,0) scale(1); }
    to   { transform: translate3d(-4vmax, 3vmax, 0) scale(1.08); }
  }
  main {
    position: relative;
    max-width: 620px;
    width: 100%;
  }
  .eyebrow {
    font-size: .78rem;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 1.4rem;
  }
  h1 {
    font-size: clamp(2rem, 6vw, 3.1rem);
    line-height: 1.15;
    letter-spacing: -.02em;
    font-weight: 650;
    margin-bottom: 1.2rem;
  }
  h1 span { color: var(--muted); }
  .lead {
    font-size: 1.02rem;
    line-height: 1.75;
    color: var(--muted);
    max-width: 46ch;
    margin-bottom: 2.6rem;
  }
  nav { display: flex; flex-wrap: wrap; gap: .7rem; }
  nav a {
    display: inline-block;
    padding: .62rem 1.15rem;
    border: 1px solid var(--line);
    border-radius: 999px;
    color: var(--fg);
    text-decoration: none;
    font-size: .9rem;
    transition: border-color .2s ease, background .2s ease, transform .2s ease;
  }
  nav a:hover {
    border-color: var(--accent);
    background: rgba(124,140,255,.08);
    transform: translateY(-1px);
  }
  footer {
    position: fixed;
    bottom: 1.6rem; left: 0; right: 0;
    text-align: center;
    font-size: .78rem;
    color: #4b5063;
    letter-spacing: .04em;
  }
  @media (max-width: 480px) {
    footer { position: static; margin-top: 3rem; }
  }
</style>
</head>
<body>
  <div class="orb"></div>
  <main>
    <p class="eyebrow">Hello, world</p>
    <h1>这是你的第一个页面 <span>—— 改掉它</span></h1>
    <p class="lead">
      页面已经上线了。把标题、这一段文字和下面的链接换成你自己的内容，
      就是一个真正属于你的站点。改动只需要编辑这个 HTML 文件。
    </p>
    <nav>
      <a href="#">关于我</a>
      <a href="#">写的东西</a>
      <a href="mailto:you@example.com">联系</a>
    </nav>
  </main>
  <footer>henwei.top · 2026</footer>
</body>
</html>
